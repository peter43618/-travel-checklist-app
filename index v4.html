<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315bea">
<title>CheckList – Smart Travel</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--p:#315bea;--soft:#eef2ff;--line:#e7eaf0;--shadow:0 10px 30px rgba(23,32,51,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.top{background:linear-gradient(145deg,#172033,#315bea);color:#fff;padding:18px 16px 46px;border-radius:0 0 30px 30px}.wrap,main{max-width:920px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:21px;font-weight:900}.lang{display:flex;gap:3px;background:rgba(255,255,255,.12);padding:4px;border-radius:12px}.lang button{border:0;background:transparent;color:#fff;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:800}.lang button.active{background:#fff;color:var(--p)}
.hero{padding:25px 2px 0}.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:#dce4ff;line-height:1.6;font-size:15px}
main{margin-top:-18px;padding:0 14px 50px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#fff;padding:7px;border-radius:20px;box-shadow:var(--shadow)}.tab{border:0;background:#fff;color:var(--muted);border-radius:14px;padding:12px 5px;font-weight:850;font-size:13px}.tab.active{background:var(--soft);color:var(--p)}.tab.locked{opacity:.48}
.panel{margin-top:14px;background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:23px}.sub,.note{color:var(--muted);font-size:14px;line-height:1.6;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-top:18px}.field label{display:block;font-size:13px;font-weight:850;margin-bottom:7px}.field input,.field select,.qty{width:100%;border:1px solid #dfe4ec;border-radius:13px;padding:12px;outline:none;background:#fff}.field input:focus,.field select:focus,.qty:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(49,91,234,.1)}
.section{font-size:18px;font-weight:900;margin:23px 0 10px}.people{display:grid;gap:10px}.person{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fbfcff}.pt{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:var(--soft);color:var(--p);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:850;color:var(--ink)}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}
.hint,.weather{margin-top:14px;background:#f8fafc;border:1px dashed #d6dce7;border-radius:15px;padding:12px 14px;line-height:1.6;font-size:13px}.weather{border-style:solid;background:#f7f9ff}.weather strong{font-size:15px}.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.wx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.wx b{display:block;font-size:13px}.wx span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.block{margin-top:14px;border:1px solid var(--line);border-radius:19px;overflow:hidden}.blockhead{padding:14px;background:#f8faff;display:flex;justify-content:space-between;gap:10px;align-items:center}.rows{background:#fff}.row{display:grid;grid-template-columns:24px 1fr 100px;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--line)}.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--p)}.row.done .item{text-decoration:line-through;color:#98a2b3}.qty{text-align:center;padding:8px;font-weight:850}.unit{font-size:11px;color:var(--muted);white-space:nowrap}.progress{height:8px;background:#edf0f5;overflow:hidden;border-radius:99px;margin:0 13px 7px}.progress i{display:block;height:100%;background:var(--p);border-radius:99px}
.lock{display:flex;align-items:center;justify-content:center;min-height:180px;text-align:center;color:var(--muted);padding:20px}.lock div{max-width:420px}.lock b{display:block;color:var(--ink);font-size:20px;margin-bottom:7px}
@media(max-width:650px){.tabs{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:27px}.row{grid-template-columns:24px 1fr 95px}.weather-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
<div class="wrap">
<div class="topbar"><div class="logo">✓ CheckList <span style="opacity:.6">Smart Travel</span></div><div class="lang" id="lang"></div></div>
<div class="hero"><h1 id="heroTitle"></h1><p id="heroText"></p></div>
</div>
</header>
<main><div class="tabs" id="tabs"></div><section class="panel" id="panel"></section></main>

<script>
const I18N={

title:"Packen, aber smart.",hero:"Reiseziel + Reisedaten + Personen eingeben. Wir erstellen eine realistische Packliste und berücksichtigen das Wetter, wenn eine Vorhersage verfügbar ist.",
travel:"✈️ Reisen",school:"🎒 Schule",baby:"👶 Baby",shop:"🛒 Einkauf",
travelTitle:"Smart Travel Packing",dest:"Reiseziel",from:"Hinreise",to:"Rückreise",people:"Wer reist mit?",
adult:"+ Erwachsene",child:"+ Kind",babyAdd:"+ Baby",create:"✨ Packliste erstellen",
name:"Name",age:"Alter",gender:"Geschlecht",male:"Männlich",female:"Weiblich",na:"Nicht angegeben",remove:"Löschen",
empty:"Füge mindestens eine Person hinzu.",locked:"Kommt bald",lockedText:"Dieser Bereich ist für die nächste Version reserviert. Aktuell testen wir nur Smart Travel.",

days:"Tage",check:"🧳 Deine persönliche Packliste",edit:"Mengen sind Vorschläge und können geändert werden.",done:"erledigt",

title:"حضّر سفرتك بطريقة ذكية.",hero:"حط الوجهة وتواريخ السفر والأشخاص. منعملك لائحة واقعية وبنراعي الطقس لما تكون التوقعات متاحة.",
travel:"✈️ السفر",school:"🎒 المدرسة",baby:"👶 البيبي",shop:"🛒 السوبرماركت",
travelTitle:"Smart Travel Packing",dest:"الوجهة",from:"تاريخ الذهاب",to:"تاريخ العودة",people:"مين مسافر؟",
adult:"+ بالغ",child:"+ طفل",babyAdd:"+ بيبي",create:"✨ اعمل لائحة السفر",name:"الاسم",age:"العمر",gender:"الجنس",male:"ذكر",female:"أنثى",na:"غير محدد",remove:"حذف",
empty:"أضف شخصاً واحداً على الأقل.",locked:"قريباً",lockedText:"هيدا القسم للنسخة الجاية. حالياً عم نختبر Smart Travel فقط.",
weather:"🌤️ الطقس ونصيحة التجهيز",loading:"عم نحمل الطقس …",noWeather:"ما في توقع دقيق لهالفترة بعد. رح نعتمد على التاريخ والمنطقة لنصيحة موسمية.",
days:"يوم",check:"🧳 لائحة السفر الخاصة فيك",edit:"الكميات اقتراحات وفِيك تعدّلها.",done:"مكتمل",
items:{t:"تيشيرتات",b:"شورتات / بناطيل",u:"ملابس داخلية",p:"بيجاما",s:"جوارب",sw:"ملابس سباحة",bra:"برا",sh:"أحذية",sun:"عوينات شمس",spf:"كريم شمس",towel:"منشفة بحر",med:"أدوية شخصية",chg:"شاحن الهاتف",diaper:"حفاضات",wipes:"مناديل مبللة",outfit:"ملابس كاملة",body:"بودي / ملابس داخلية",hat:"قبعة شمس",bsp:"كريم شمس للبيبي",cream:"كريم حفاض",bottle:"رضّاعات",milk:"حليب / غذاء",pac:"مصّاصات",blanket:"بطانية",stroller:"عربة / كرسي سيارة",light:"جاكيت خفيف / كنزة",warm:"كنزة دافية",rain:"جاكيت مطر",cap:"قبعة"},

title:"Pack smarter.",hero:"Enter your destination, dates and travellers. We build a realistic packing list and use weather data when a forecast is available.",
travel:"✈️ Travel",school:"🎒 School",baby:"👶 Baby",shop:"🛒 Shopping",
travelTitle:"Smart Travel Packing",dest:"Destination",from:"Departure",to:"Return",people:"Who is travelling?",
adult:"+ Adult",child:"+ Child",babyAdd:"+ Baby",create:"✨ Create packing list",name:"Name",age:"Age",gender:"Gender",male:"Male",female:"Female",na:"Not specified",remove:"Remove",
empty:"Add at least one person.",locked:"Coming soon",lockedText:"This area is reserved for a future version. We are testing Smart Travel first.",
weather:"🌤️ Weather & packing advice",loading:"Loading weather …",noWeather:"A precise forecast is not available for this far ahead. We use the dates and region for a seasonal recommendation.",
days:"days",check:"🧳 Your personal packing list",edit:"Quantities are suggestions and can be changed.",done:"done",
items:{t:"T-shirts",b:"Shorts / trousers",u:"Underwear",p:"Pyjamas",s:"Socks",sw:"Swimwear",bra:"Bras",sh:"Shoes",sun:"Sunglasses",spf:"Sunscreen",towel:"Beach towel",med:"Personal medication",chg:"Phone charger",diaper:"Diapers",wipes:"Wet wipes",outfit:"Complete outfits",body:"Bodys / underwear",hat:"Sun hat",bsp:"Baby sunscreen",cream:"Nappy cream",bottle:"Baby bottles",milk:"Milk / food",pac:"Pacifiers",blanket:"Blanket",stroller:"Stroller / car seat",light:"Light jacket / sweater",warm:"Warm sweater",rain:"Rain jacket",cap:"Cap"},
units:{pcs:"pcs.",pair:"pairs",pack:"pack",need:"as needed"}}
};

let S=JSON.parse(localStorage.getItem("smartTravelV4")||"null")||{lang:"de",dest:"",from:"",to:"",people:[],made:false,weather:null,qty:{}};
let tab="travel";
const T=()=>I18N[S.lang]||I18N.de;
const save=()=>localStorage.setItem("smartTravelV4",JSON.stringify(S));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const typeName=p=>p.type==="baby"?"Baby":p.type==="child"?(S.lang==="de"?"Kind":S.lang==="ar"?"طفل":"Child"):(S.lang==="de"?"Erwachsene/r":S.lang==="ar"?"بالغ":"Adult");

function setLang(x){S.lang=x;save();render()}
function addPerson(type){S.people.push({type,name:"",age:type==="baby"?0:type==="child"?7:30,gender:"na"});S.made=false;save();render()}
function tripDays(){if(!S.from||!S.to)return 1;return Math.max(1,Math.round((new Date(S.to+"T12:00")-new Date(S.from+"T12:00"))/86400000)+1)}
function season(){const m=S.from?new Date(S.from+"T12:00").getMonth()+1:new Date().getMonth()+1;return [6,7,8].includes(m)?"hot":[3,4,5,9,10].includes(m)?"mild":"cool"}

function buildItems(p,w){
 const d=tripDays(), age=+p.age||0, hot=w?.hot??(season()==="hot"), cool=w?.cool??(season()==="cool"), rain=w?.rain??false;
 if(p.type==="baby"||age<2){
   return [["diaper",Math.min(90,d*6)],["wipes",Math.max(1,Math.ceil(d/3)),"pack"],["outfit",Math.min(20,Math.ceil(d*.7)+3),"pcs"],["body",Math.min(20,Math.ceil(d*.7)+3),"pcs"],["p",Math.max(2,Math.ceil(d/2)),"pcs"],["s",Math.max(2,Math.ceil(d*.6)+1),"pair"],["hat",1,"pcs"],["bsp",hot?1:0,"pack"],["cream",1,"pack"],["bottle",3,"pcs"],["milk",Math.max(1,d+1),"pack"],["pac",2,"pcs"],["blanket",1,"pcs"],["stroller",1,"need"],["towel",2,"pcs"]];
 }
 let a=[["t",Math.min(14,Math.ceil(d*.5)+2),"pcs"],["b",Math.max(2,Math.ceil(d*.4)+1),"pcs"],["u",Math.min(16,d+2),"pcs"],["p",Math.max(2,Math.ceil(d/2)),"pcs"],["s",Math.min(12,Math.ceil(d*.6)+1),"pair"],["sw",hot?Math.max(2,Math.ceil(d*.5)+1):1,"pcs"],["sh",2,"pair"],["sun",1,"pcs"],["spf",hot?1:0,"pack"],["towel",1,"pcs"],["med",1,"need"],["chg",1,"pcs"]];
 if(cool)a.push(["light",2,"pcs"]);
 if(!hot&&cool)a.push(["warm",1,"pcs"]);
 if(rain)a.push(["rain",1,"pcs"]);
 if(p.type==="adult"&&p.gender==="female")a.push(["bra",Math.min(8,Math.ceil(d*.5)+1),"pcs"]);
 if(p.type==="child"&&cool)a.push(["cap",1,"pcs"]);
 return a;
}

function weatherDescription(w){
 if(!w)return T().noWeather;
 if(w.max==null)return T().noWeather;
 const temp=w.max>=28?(S.lang==="de"?"heiß":S.lang==="ar"?"حار":"hot"):w.max>=22?(S.lang==="de"?"warm":S.lang==="ar"?"دافي":"warm"):(S.lang==="de"?"mild/kühl":S.lang==="ar"?"معتدل/بارد":"mild/cool");
 const rain=w.rain?(S.lang==="de"?" · Regen möglich":S.lang==="ar"?" · احتمال مطر":" · rain possible"):"";
 return `${w.min}–${w.max} °C · ${temp}${rain}`;
}

async function loadWeather(){
 const box=document.querySelector("#wx");
 if(!box||!S.dest||!S.from)return;
 box.innerHTML="<b>"+T().loading+"</b>";
 try{
   const geo=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(S.dest)+"&count=1&language=en&format=json").then(r=>r.json());
   if(!geo.results?.length)throw new Error("not found");
   const q=geo.results[0];
   const start=new Date(S.from+"T12:00"), now=new Date(), diff=(start-now)/86400000;
   if(diff>-2&&diff<15){
     const url="https://api.open-meteo.com/v1/forecast?latitude="+q.latitude+"&longitude="+q.longitude+"&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date="+S.from+"&end_date="+S.to;
     const data=await fetch(url).then(r=>r.json());
     if(data.daily){
       const max=Math.max(...data.daily.temperature_2m_max), min=Math.min(...data.daily.temperature_2m_min);
       S.weather={city:q.name,max:Math.round(max),min:Math.round(min),rain:data.daily.precipitation_probability_max.some(x=>x>=40),hot:max>=25,cool:min<14};
       save();render();return;
     }
   }
   S.weather={city:q.name,max:null,min:null,rain:false,hot:season()==="hot",cool:season()==="cool",seasonal:true};
   save();render();
 }catch(e){S.weather=null;save();box.innerHTML="<b>"+T().noWeather+"</b>"}
}

function weatherBox(){
 const t=T(),w=S.weather;
 if(!w)return `<div class="weather" id="wx"><b>${t.noWeather}</b></div>`;
 return `<div class="weather" id="wx"><strong>${t.weather}</strong><div class="note">${esc(w.city)} · ${w.max!=null?weatherDescription(w):t.noWeather}</div></div>`;
}

function personCard(p,i){
 const t=T();
 return `<div class="person">
 <div class="pt"><b>${esc(p.name||typeName(p)+" "+(i+1))}</b><span class="pill">${typeName(p)}</span></div>
 <div class="grid">
  <div class="field"><label>${t.name}</label><input data-p="${i}" data-f="name" value="${esc(p.name)}" placeholder="${t.name}"></div>
  <div class="field"><label>${t.age}</label><input data-p="${i}" data-f="age" type="number" min="0" max="100" value="${p.age}"></div>
  ${p.type!=="baby"?`<div class="field"><label>${t.gender}</label><select data-p="${i}" data-f="gender"><option value="na"${p.gender==="na"?" selected":""}>${t.na}</option><option value="male"${p.gender==="male"?" selected":""}>${t.male}</option><option value="female"${p.gender==="female"?" selected":""}>${t.female}</option></select></div>`:""}
 </div>
 <div class="actions"><button class="btn" data-del="${i}">${t.remove}</button></div>
 </div>`;
}

function checklist(){
 const t=T(),d=tripDays();
 let h=`<div class="section">${t.check}</div><div class="hint">${t.edit} · ${d} ${t.days}</div>`;
 S.people.forEach((p,i)=>{
   const arr=buildItems(p,S.weather),done=JSON.parse(localStorage.getItem("v4done_"+i)||"[]"),finished=done.length,pct=arr.length?Math.round(finished/arr.length*100):0;
   h+=`<div class="block"><div class="blockhead"><div><b>${esc(p.name||typeName(p)+" "+(i+1))}</b><div class="note">${finished}/${arr.length} ${t.done}</div></div><span class="pill">${typeName(p)}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="rows">`;
   arr.forEach((x,j)=>{
     const q=S.qty[i+"_"+x[0]]??x[1];
     h+=`<div class="row ${done.includes(j)?"done":""}"><input type="checkbox" data-ci="${i}" data-ii="${j}"${done.includes(j)?" checked":""}><span class="item">${t.items[x[0]]}</span><div><input class="qty" type="number" min="0" value="${q}" data-qi="${i}" data-qk="${x[0]}"><span class="unit">${t.units[x[2]]}</span></div></div>`;
   });
   h+="</div></div>";
 });
 return h;
}

function render(){
 const t=T();
 document.documentElement.lang=S.lang;
 document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 document.querySelector("#heroTitle").textContent=t.title;
 document.querySelector("#heroText").textContent=t.hero;
 document.querySelector("#lang").innerHTML=["de","en","ar"].map(x=>`<button class="${S.lang===x?"active":""}" data-lang="${x}">${x.toUpperCase()}</button>`).join("");
 document.querySelectorAll("[data-lang]").forEach(x=>x.onclick=()=>setLang(x.dataset.lang));
 document.querySelector("#tabs").innerHTML=[["travel",t.travel],["school",t.school],["baby",t.baby],["shop",t.shop]].map(x=>`<button class="tab ${tab===x[0]?"active":""} ${x[0]!=="travel"?"locked":""}" data-tab="${x[0]}">${x[1]}${x[0]!=="travel"?" 🔒":""}</button>`).join("");
 document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});
 const panel=document.querySelector("#panel");
 if(tab!=="travel"){panel.innerHTML=`<div class="lock"><div><b>🔒 ${t.locked}</b>${t.lockedText}</div></div>`;return}
 panel.innerHTML=`<div class="head"><div><h2>${t.travelTitle}</h2><p class="sub">${t.hero}</p></div></div>
 <div class="grid">
  <div class="field"><label>📍 ${t.dest}</label><input id="dest" value="${esc(S.dest)}" placeholder="${S.lang==="de"?"z. B. Beirut, Barcelona, Malediven":S.lang==="ar"?"مثلاً بيروت، برشلونة، المالديف":"e.g. Beirut, Barcelona, Maldives"}"></div>
  <div class="field"><label>📅 ${t.from}</label><input id="from" type="date" value="${S.from}"></div>
  <div class="field"><label>📅 ${t.to}</label><input id="to" type="date" value="${S.to}"></div>
 </div>
 <div class="section">👨‍👩‍👧‍👦 ${t.people}</div>
 <div class="people">${S.people.length?S.people.map(personCard).join(""):`<div class="hint">${t.empty}</div>`}</div>
 <div class="actions"><button class="btn" id="adult">${t.adult}</button><button class="btn" id="child">${t.child}</button><button class="btn" id="baby">${t.babyAdd}</button><button class="btn primary" id="make">${t.create}</button></div>
 ${S.made?weatherBox()+checklist():""}`;
 document.querySelector("#dest").oninput=e=>{S.dest=e.target.value;save()};
 document.querySelector("#from").onchange=e=>{S.from=e.target.value;S.made=false;save()};
 document.querySelector("#to").onchange=e=>{S.to=e.target.value;S.made=false;save()};
 document.querySelector("#adult").onclick=()=>addPerson("adult");
 document.querySelector("#child").onclick=()=>addPerson("child");
 document.querySelector("#baby").onclick=()=>addPerson("baby");
 document.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{S.people.splice(+x.dataset.del,1);S.made=false;save();render()});
 document.querySelectorAll("[data-p]").forEach(x=>x.oninput=()=>{S.people[+x.dataset.p][x.dataset.f]=x.value;S.made=false;save()});
 document.querySelector("#make").onclick=async()=>{
   if(!S.dest||!S.from||!S.to)return alert(S.lang==="de"?"Bitte Ziel und beide Reisedaten eingeben.":S.lang==="ar"?"اكتب الوجهة وتاريخي السفر.":"Enter destination and both travel dates.");
   if(new Date(S.to)<new Date(S.from))return alert(S.lang==="de"?"Das Rückreisedatum muss nach der Hinreise liegen.":S.lang==="ar"?"تاريخ العودة لازم يكون بعد الذهاب.":"Return date must be after departure.");
   if(!S.people.length)return alert(t.empty);
   S.made=true;S.weather=null;save();render();loadWeather();
 };
 document.querySelectorAll("[data-ci]").forEach(x=>x.onchange=()=>{
   const k="v4done_"+x.dataset.ci;let a=JSON.parse(localStorage.getItem(k)||"[]");
   a=x.checked?[...new Set([...a,+x.dataset.ii])]:a.filter(i=>i!==+x.dataset.ii);localStorage.setItem(k,JSON.stringify(a));render();
 });
