<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CheckList</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#e8ebf1;--accent:#315bea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,#182230,#315bea);color:#fff;padding:28px 20px 34px;border-radius:0 0 28px 28px}
.wrap{max-width:900px;margin:auto}.brand{font-size:25px;font-weight:900}.brand span{opacity:.75}.hero{margin-top:28px}.hero h1{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:#dbe4ff}
main{max-width:900px;margin:-14px auto 0;padding:0 16px 40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:var(--card);padding:9px;border-radius:20px;box-shadow:0 8px 28px #18223012}
.tab{border:0;background:transparent;border-radius:14px;padding:13px 5px;font-weight:800;color:var(--muted);cursor:pointer;font-size:14px}.tab.active{background:#eef2ff;color:var(--accent)}
.panel{margin-top:16px;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 8px 28px #1822300c}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font-size:22px}.reset{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;color:var(--muted);cursor:pointer}
.progress{margin:16px 0 18px;height:10px;background:#edf0f5;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:.25s}
.item{display:flex;align-items:center;gap:13px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border-bottom:0}.item input{width:21px;height:21px;accent-color:var(--accent)}.item.done .text{text-decoration:line-through;color:#98a2b3}.count{font-size:13px;color:var(--muted)}
@media(max-width:600px){.tabs{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">✓ CheckList <span>• Smart Lists</span></div>
<div class="hero"><h1>كل شي لازمك بمكان واحد</h1><p>اختار القائمة وعلّم على الأشياء. الاختيارات تنحفظ تلقائياً على جهازك.</p></div></div></header>
<main>
<div class="tabs" id="tabs"></div>
<section class="panel"><div class="head"><h2 id="title"></h2><button class="reset" id="reset">تصفير</button></div>
<div class="progress"><i id="bar"></i></div><div id="list"></div><div class="count" id="count"></div></section>
</main>
<script>
const lists={
travel:{name:"✈️ السفر",items:["جوازات السفر والهويات","تذاكر السفر","حجز الفندق","تأمين السفر","بطاقات ونقود","شاحن الهاتف","أدوية أساسية","ملابس","ملابس الأطفال","حفاضات","عربة الأطفال","حقيبة اليد","نسخ من الوثائق"]},
school:{name:"🎒 المدرسة",items:["حقيبة المدرسة","دفاتر","أقلام وألوان","مقلمة","قارورة ماء","علبة طعام","ملابس احتياطية","حذاء رياضي","مناديل","واقي شمس"]},
baby:{name:"👶 البيبي",items:["حفاضات","مناديل مبللة","كريم الحفاض","ملابس للبيبي","رضّاعة","حليب","مصّاصة","بطانية","منشفة","ميزان حرارة","أدوية موصوفة","عربة الأطفال"]},
market:{name:"🛒 السوبرماركت",items:["حليب","بيض","خبز","أرز","معكرونة","خضار","فواكه","دجاج / لحم","زبادي","جبنة","مياه","مناديل","منظفات","حفاضات"]}
};
let current="travel";
const tabs=document.querySelector("#tabs"),list=document.querySelector("#list"),title=document.querySelector("#title"),bar=document.querySelector("#bar"),count=document.querySelector("#count");
function key(){return "checklist_"+current}
function selected(){return JSON.parse(localStorage.getItem(key())||"[]")}
function render(){
tabs.innerHTML=Object.entries(lists).map(([k,v])=>`<button class="tab ${k===current?"active":""}" data-k="${k}">${v.name}</button>`).join("");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.k;render()});
title.textContent=lists[current].name;let a=selected();
list.innerHTML=lists[current].items.map((x,i)=>`<label class="item ${a.includes(i)?"done":""}"><input type="checkbox" ${a.includes(i)?"checked":""} data-i="${i}"><span class="text">${x}</span></label>`).join("");
document.querySelectorAll(".item input").forEach(c=>c.onchange=()=>{let a=selected();a=c.checked?[...new Set([...a,+c.dataset.i])]:a.filter(i=>i!==+c.dataset.i);localStorage.setItem(key(),JSON.stringify(a));render()});
let n=a.length,total=lists[current].items.length;bar.style.width=(n/total*100)+"%";count.textContent=`${n} من ${total} مكتملة`;
}
document.querySelector("#reset").onclick=()=>{localStorage.removeItem(key());render()};render();
</script>
</body></html>
