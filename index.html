<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CheckList – Smart Travel V5</title>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}.top{background:linear-gradient(140deg,#172033,#315bea);color:white;padding:20px;border-radius:0 0 28px 28px}.wrap,main{max-width:900px;margin:auto}.topbar{display:flex;justify-content:space-between}.lang button{border:0;border-radius:8px;padding:6px}.hero h1{margin:28px 0 6px}.hero p{color:#dce4ff}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:white;padding:6px;border-radius:18px;box-shadow:0 8px 25px #0001}.tab{border:0;background:white;padding:12px;border-radius:12px;font-weight:bold}.active{color:#315bea;background:#eef2ff}.locked{opacity:.45}main{margin-top:-18px;padding:0 14px 50px}.panel{background:white;margin-top:14px;padding:18px;border-radius:22px;box-shadow:0 8px 25px #0001}.grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-top:15px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select,.qty{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dfe4ec;border-radius:11px}.section{font-size:18px;font-weight:bold;margin:22px 0 9px}.person,.acc{border:1px solid #e7eaf0;border-radius:16px;margin:9px 0;padding:13px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #ddd;background:white;padding:10px 13px;border-radius:11px;font-weight:bold}.primary{background:#315bea;color:white;border-color:#315bea}.weather,.smart{margin-top:14px;padding:12px;border-radius:13px;background:#f7f9ff}.acc{padding:0;overflow:hidden}.accHead{width:100%;border:0;background:white;padding:14px;display:flex;justify-content:space-between;text-align:left;font-weight:bold}.accBody{display:none;border-top:1px solid #eee}.open .accBody{display:block}.progress{height:6px;background:#eee;margin:12px}.progress i{display:block;height:100%;background:#315bea}.row{display:grid;grid-template-columns:25px 1fr 100px;gap:8px;align-items:center;border-top:1px solid #eee;padding:10px}.row.done b{text-decoration:line-through;color:#98a2b3}.reason{display:block;color:#667085;font-size:11px}.qty{text-align:center}.unit{font-size:11px;color:#667085}.muted{color:#667085;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:25px 1fr 90px}}
</style></head><body>
<header class="top"><div class="wrap"><div class="topbar"><b>✓ CheckList · Smart Travel V5</b><div class="lang"><button onclick="setLang('de')">DE</button><button onclick="setLang('ar')">AR</button><button onclick="setLang('en')">EN</button></div></div><div class="hero"><h1 id="hero"></h1><p id="herot"></p></div></div></header>
<main><div class="tabs"><button class="tab active" id="tt"></button><button class="tab locked" onclick="alert(T.lockedText)" id="ts"></button><button class="tab locked" onclick="alert(T.lockedText)" id="tb"></button><button class="tab locked" onclick="alert(T.lockedText)" id="tshop"></button></div><section class="panel" id="app"></section></main>
<script>
const L={
de:{hero:"Packen, aber smart.",herot:"Die Smart Engine passt die Liste an Person, Alter, Reisedauer, Ziel, Saison und Wetter an.",tt:"✈️ Reisen",ts:"🎒 Schule",tb:"👶 Baby",tshop:"🛒 Einkauf",title:"Smart Travel Packing",dest:"Reiseziel",from:"Hinreise",to:"Rückreise",people:"Wer reist mit?",adult:"+ Erwachsener",child:"+ Kind",baby:"+ Baby",name:"Name",age:"Alter",gender:"Geschlecht",male:"Männlich",female:"Weiblich",na:"Nicht angegeben",remove:"Löschen",create:"✨ Smart-Packliste erstellen",weather:"🌤️ Wetter & Saison",forecast:"Noch keine genaue Vorhersage. Die typische Saison wird genutzt.",list:"🧳 Persönliche Packlisten",smart:"🧠 Smart Engine",lockedText:"Dieser Bereich kommt in einer späteren Version.",done:"erledigt",items:{t:"T-Shirts",b:"Shorts / Hosen",u:"Unterwäsche",p:"Schlafanzüge",s:"Socken",sw:"Badebekleidung",bra:"BHs",slip:"Slips / Unterhosen",string:"Strings",dress:"Kleider",sh:"Alltagsschuhe",sand:"Sandalen / Flip-Flops",sun:"Sonnenbrille",spf:"Sonnencreme",towel:"Strandhandtuch",med:"Persönliche Medikamente",chg:"Handyladegerät",umb:"Regenschirm",rain:"Regenjacke",light:"Leichte Jacke / Pullover",warm:"Warmer Pullover",diaper:"Windeln",wipes:"Feuchttücher",outfit:"Komplette Outfits",body:"Bodys / Unterwäsche",hat:"Sonnenhut",cream:"Wundschutzcreme",bottle:"Babyflaschen",milk:"Milch / Nahrung",pac:"Schnuller",blanket:"Decke",stroller:"Kinderwagen / Autositz",bib:"Lätzchen",toy:"Lieblingsspielzeug"},why:{woman:"Für weibliche Erwachsene angepasst.",child:"Mehr Wechselkleidung für Kinder.",baby:"Mit Reserve für häufiges Wechseln.",hot:"Für warmes Wetter.",rain:"Regenschutz wegen Regenrisiko.",base:"Sinnvolle Menge mit Wiederverwendung."}},
ar:{hero:"حضّر سفرتك بطريقة ذكية.",herot:"اللائحة الذكية بتحسب الأغراض حسب العمر والمدة والوجهة والموسم والطقس.",tt:"✈️ سفر",ts:"🎒 مدرسة",tb:"👶 بيبي",tshop:"🛒 تسوّق",title:"قائمة السفر الذكية",dest:"الوجهة",from:"الذهاب",to:"العودة",people:"مين مسافر معك؟",adult:"+ شخص بالغ",child:"+ طفل",baby:"+ بيبي",name:"الاسم",age:"العمر",gender:"الجنس",male:"ذكر",female:"أنثى",na:"غير محدد",remove:"حذف",create:"✨ أنشئ القائمة",weather:"🌤️ الطقس والموسم",forecast:"ما في توقع دقيق بعد، عم نستخدم طقس الموسم المعتاد.",list:"🧳 قوائم الأغراض",smart:"🧠 Smart Engine",lockedText:"هالقسم رح يجي بنسخة لاحقة.",done:"مكتمل",items:{t:"تيشيرتات",b:"شورتات / بناطيل",u:"ملابس داخلية",p:"بيجامات",s:"جرابات",sw:"لباس سباحة",bra:"حمالات صدر",slip:"كيلوت / ملابس داخلية",string:"سترينغ",dress:"فساتين",sh:"أحذية يومية",sand:"صنادل / شبشب",sun:"نظارات شمس",spf:"واقي شمس",towel:"منشفة شاطئ",med:"أدوية شخصية",chg:"شاحن موبايل",umb:"مظلة",rain:"جاكيت مطر",light:"جاكيت خفيف / كنزة",warm:"كنزة دافئة",diaper:"حفاضات",wipes:"مناديل مبللة",outfit:"أطقم كاملة",body:"بودي / ملابس داخلية",hat:"قبعة شمس",cream:"كريم تسلخات",bottle:"رضّاعات",milk:"حليب / أكل",pac:"لهايات",blanket:"بطانية",stroller:"عربة / كرسي سيارة",bib:"مراويل",toy:"لعبة مفضلة"},why:{woman:"معدّلة للأنثى البالغة.",child:"زيادة تبديل الملابس للطفل.",baby:"مع احتياط للتبديل المتكرر.",hot:"للطقس الحار.",rain:"للوقاية من المطر.",base:"كمية منطقية مع إعادة الاستخدام."}},
en:{hero:"Pack smarter.",herot:"The Smart Engine adapts the list to each person, age, trip length, destination, season and weather.",tt:"✈️ Travel",ts:"🎒 School",tb:"👶 Baby",tshop:"🛒 Shopping",title:"Smart Travel Packing",dest:"Destination",from:"Departure",to:"Return",people:"Who is travelling?",adult:"+ Adult",child:"+ Child",baby:"+ Baby",name:"Name",age:"Age",gender:"Gender",male:"Male",female:"Female",na:"Not specified",remove:"Remove",create:"✨ Create smart list",weather:"🌤️ Weather & season",forecast:"No precise forecast yet; typical seasonal conditions are used.",list:"🧳 Personal packing lists",smart:"🧠 Smart Engine",lockedText:"This section is coming in a later version.",done:"done",items:{t:"T-shirts",b:"Shorts / trousers",u:"Underwear",p:"Pyjamas",s:"Socks",sw:"Swimwear",bra:"Bras",slip:"Briefs / underwear",string:"Thongs",dress:"Dresses",sh:"Everyday shoes",sand:"Sandals / flip-flops",sun:"Sunglasses",spf:"Sunscreen",towel:"Beach towel",med:"Personal medication",chg:"Phone charger",umb:"Umbrella",rain:"Rain jacket",light:"Light jacket / sweater",warm:"Warm sweater",diaper:"Diapers",wipes:"Wet wipes",outfit:"Complete outfits",body:"Bodys / underwear",hat:"Sun hat",cream:"Nappy cream",bottle:"Baby bottles",milk:"Milk / food",pac:"Pacifiers",blanket:"Blanket",stroller:"Stroller / car seat",bib:"Bibs",toy:"Favourite toy"},why:{woman:"Adjusted for adult women.",child:"Extra changes for children.",baby:"Extra reserve for frequent changes.",hot:"For warm weather.",rain:"For rain protection.",base:"Sensible amount with reuse."}}
};
let lang=localStorage.getItem("smartTravelLang")||"de",people=[{id:1,type:"adult",name:"",age:34,gender:"male"}],open=1,result=null;
const $=x=>document.getElementById(x);let T=L[lang];
function setLang(x){lang=x;localStorage.setItem("smartTravelLang",x);T=L[x];render()}
function add(type){people.push({id:Date.now()+Math.random(),type,name:"",age:type==="adult"?34:type==="child"?3:0,gender:type==="adult"||type==="child"?"male":"na"});render()}
function del(id){people=people.filter(p=>p.id!==id);open=people[0]?.id;render()}
function label(p){if(p.name.trim())return p.name.trim();let n=people.filter(x=>x.type===p.type).findIndex(x=>x.id===p.id)+1;return (p.type==="adult"?T.adult.slice(2):p.type==="child"?T.child.slice(2):T.baby.slice(2))+" "+n}
function days(){let a=$("from").value,b=$("to").value;if(!a||!b)return 7;return Math.max(1,Math.min(90,Math.round((new Date(b)-new Date(a))/86400000)+1))}
function season(){let m=new Date($("from").value||Date.now()).getMonth()+1;return [6,7,8].includes(m)?"hot":[3,4,5,9,10].includes(m)?"mild":"cool"}
function beach(s){return /beirut|lebanon|mallorca|malta|cyprus|antalya|alanya|rhodes|crete|sharm|hurghada|dubai|marmaris|bodrum/i.test(s)}
function items(p){
let d=days(),s=season(),bt=beach($("destination").value),c=p.type==="child",w=p.type==="adult"&&p.gender==="female",wash=d<=7?1:d<=14?.82:d<=30?.62:.55,base=Math.max(2,Math.ceil((Math.min(d,14)*.62+2)*wash*(c?1.28:1)));
if(p.type==="baby")return [["diaper",Math.min(90,d*6+Math.ceil(d*.8)),"pcs"],["wipes",Math.max(2,Math.ceil(d/3)),"pack"],["outfit",Math.max(3,Math.ceil(d*.75)+2),"pcs"],["body",Math.max(4,Math.ceil(d*.9)+2),"pcs"],["p",Math.max(2,Math.ceil(d*.5)+1),"pcs"],["s",Math.max(3,Math.ceil(d*.65)+1),"pcs"],["hat",s==="hot"?1:0,"pcs"],["cream",1,"pcs"],["bottle",3,"pcs"],["milk",1,"need"],["pac",3,"pcs"],["blanket",1,"pcs"],["stroller",1,"pcs"],["bib",Math.max(3,Math.ceil(d*.7)),"pcs"],["toy",1,"pcs"]].filter(x=>x[1]);
let a=[["t",base,"pcs"],["b",Math.max(2,Math.ceil(base*.72)),"pcs"],["u",Math.max(4,Math.ceil((d*.75+2)*wash*(c?1.28:1))),"pcs"],["p",Math.max(2,Math.ceil(base*.42)),"pcs"],["s",Math.max(3,Math.ceil(base*.72)),"pcs"],["sw",(bt||s==="hot")?Math.min(4,Math.max(1,Math.ceil(d/5))):0,"pcs"],["sh",1,"pair"],["sand",(bt||s==="hot")?1:0,"pair"],["sun",s==="hot"?1:0,"pcs"],["spf",(s==="hot"||bt)?1:0,"pcs"],["towel",bt?1:0,"pcs"],["med",1,"need"],["chg",1,"pcs"],["umb",s==="cool"?1:0,"pcs"],["rain",s==="cool"?1:0,"pcs"],["light",s==="mild"?1:0,"pcs"],["warm",s==="cool"?1:0,"pcs"]];
if(w){a.push(["bra",Math.max(2,Math.ceil((d*.45+2)*wash)),"pcs"],["slip",Math.max(4,Math.ceil((d*.78+2)*wash)),"pcs"],["string",Math.max(2,Math.ceil((d*.42+1)*wash)),"pcs"],["dress",Math.max(1,Math.ceil(d/6)),"pcs"])}
return a.filter(x=>x[1]>0)}
function reason(code,p){if(p.type==="baby")return T.why.baby;if(["bra","slip","string","dress"].includes(code))return T.why.woman;if(p.type==="child")return T.why.child;if(["umb","rain"].includes(code))return T.why.rain;if(["t","b","sw","sun","spf","sand"].includes(code)&&season()==="hot")return T.why.hot;return T.why.base}
function render(){
T=L[lang];$("hero").textContent=T.hero;$("herot").textContent=T.herot;["tt","ts","tb","tshop"].forEach((id,i)=>$(id).textContent=[T.tt,T.ts,T.tb,T.tshop][i]);
$("app").innerHTML=`<h2>${T.title}</h2><div class="muted">${T.smart}</div><div class="grid"><div class="field"><label>${T.dest}</label><input id="destination" placeholder="z. B. Beirut, Libanon"></div><div class="field"><label>${T.from}</label><input id="from" type="date"></div><div class="field"><label>${T.to}</label><input id="to" type="date"></div></div><div class="section">${T.people}</div><div>${people.map(p=>`<div class="person"><b>${label(p)}</b><div class="grid"><div class="field"><label>${T.name}</label><input value="${p.name}" oninput="pfind(${p.id},'name',this.value)"></div><div class="field"><label>${T.age}</label><input type="number" min="0" value="${p.age}" oninput="pfind(${p.id},'age',this.value)"></div>${p.type!=="baby"?`<div class="field"><label>${T.gender}</label><select onchange="pfind(${p.id},'gender',this.value)"><option value="male" ${p.gender==="male"?"selected":""}>${T.male}</option><option value="female" ${p.gender==="female"?"selected":""}>${T.female}</option><option value="na" ${p.gender==="na"?"selected":""}>${T.na}</option></select></div>`:""}</div><button class="btn" onclick="del(${p.id})">${T.remove}</button></div>`).join("")}</div><div class="actions"><button class="btn" onclick="add('adult')">${T.adult}</button><button class="btn" onclick="add('child')">${T.child}</button><button class="btn" onclick="add('baby')">${T.baby}</button><button class="btn primary" onclick="make()">${T.create}</button></div><div class="weather"><b>${T.weather}</b><div id="wbox">${T.forecast}</div></div><div id="results"></div>`;
if(result){$("wbox").textContent=result.weather;draw()}}
function pfind(id,k,v){let p=people.find(x=>x.id===id);if(p)p[k]=k==="age"?+v:v}
function toggle(id){open=id;draw()}
function draw(){
$("results").innerHTML=`<div class="section">${T.list}</div><div class="muted">${T.smart}</div>`+people.map(p=>{let a=result.data[p.id]||[],ch=result.checked[p.id]||{},done=Object.values(ch).filter(Boolean).length;return `<div class="acc ${open===p.id?"open":""}"><button class="accHead" onclick="toggle(${p.id})"><span> ${p.type==="baby"?"👶":p.type==="child"?"🧒":p.gender==="female"?"👩":"👤"} ${label(p)} <small> · ${done}/${a.length} ${T.done}</small></span><span>⌄</span></button><div class="accBody"><div class="progress"><i style="width:${a.length?done/a.length*100:0}%"></i></div>${a.map((x,i)=>`<label class="row ${ch[i]?"done":""}"><input type="checkbox" ${ch[i]?"checked":""} onchange="check(${p.id},${i},this.checked)"><span><b>${T.items[x[0]]}</b><span class="reason">${reason(x[0],p)}</span></span><span><input class="qty" type="number" min="0" value="${x[1]}" onchange="qty(${p.id},${i},this.value)"><span class="unit">${x[2]==="need"?"":x[2]}</span></span></label>`).join("")}</div></div>`}).join("")}
function check(id,i,v){result.checked[id][i]=v;draw()}
function qty(id,i,v){result.data[id][i][1]=Math.max(0,+v||0);draw()}
async function make(){let d=$("destination").value.trim();if(!d||!$("from").value||!$("to").value)return alert(T.dest+" + "+T.from+" + "+T.to);let s=season(),text=(s==="hot"?"Warm":s==="cool"?"Cool":"Mild")+" seasonal conditions";result={weather:text,data:{},checked:{}};people.forEach(p=>{result.data[p.id]=items(p);result.checked[p.id]={}});$("wbox").textContent=text+" · "+T.forecast;open=people[0]?.id;draw();
try{let g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(d)+"&count=1&language=en&format=json").then(r=>r.json());let x=g.results?.[0];if(x){let dt=(new Date($("from").value)-new Date())/864e5;if(dt>=-2&&dt<15){let u=`https://api.open-meteo.com/v1/forecast?latitude=${x.latitude}&longitude=${x.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${$("from").value}&end_date=${$("to").value}`;let f=await fetch(u).then(r=>r.json());if(f.daily){result.weather=`${x.name} · ${Math.round(f.daily.temperature_2m_min[0])}–${Math.round(f.daily.temperature_2m_max[0])} °C · Regen ${f.daily.precipitation_probability_max[0]}%`;$("wbox").textContent=result.weather;draw()}}}}catch(e){}}
render();
</script></body></html>
