en:{hero:"Pack smarter.",sub:"A packing list based on destination, dates, season and each traveller.",title:"Smart Travel Packing",travel:"✈️ Travel",dest:"Destination",from:"Departure",to:"Return",people:"Who is travelling?",adult:"+ Adult",child:"+ Child",baby:"+ Baby",name:"Name",age:"Age",gender:"Gender",male:"Male",female:"Female",na:"Not specified",remove:"Remove person",make:"✨ Create / update list",climate:"🌦️ Climate and weather check",hint:"A forecast is checked when the trip is close enough.",list:"🧳 Personal packing lists",listHint:"Add, remove, check off items and change quantities. Changes are saved on this device.",add:"Add",placeholder:"Item name, e.g. headphones",done:"done",locked:"Coming in a future version.",required:"Enter destination and both travel dates.",dateerr:"Return must be on or after departure.",forecast:"No precise forecast yet; typical seasonal conditions are used.",cold:"Cold season: warm clothing and weatherproof shoes.",mild:"Mild season: layers and a light jacket.",hot:"Warm season: light clothes; sun and swim items only when suitable.",items:{shirts:"T-shirts",bottom:"Trousers / shorts",under:"Briefs / underwear",pajama:"Pyjamas",socks:"Socks",swim:"Swimwear",bra:"Bras",strings:"Thongs",dress:"Dresses",shoes:"Everyday shoes",boots:"Warm / weatherproof shoes",sandals:"Sandals / flip-flops",sun:"Sunglasses",spf:"Sunscreen",towel:"Beach towel",meds:"Personal medication",charger:"Phone charger",cable:"Charging cable",power:"Power bank",razor:"Razor / shaver",brush:"Toothbrush",paste:"Toothpaste",deodorant:"Deodorant",shampoo:"Shampoo",comb:"Comb / brush",umbrella:"Umbrella",rain:"Rain jacket",light:"Light jacket",warm:"Warm sweater",coat:"Winter coat",gloves:"Gloves",hat:"Warm hat",diaper:"Diapers",wipes:"Wet wipes",outfit:"Change outfits",body:"Bodysuits",cream:"Nappy cream",bottle:"Baby bottles",milk:"Milk / food",pacifier:"Pacifier",blanket:"Blanket",stroller:"Stroller / car seat",bib:"Bibs",toy:"Favourite toy"}}
};
let lang=localStorage.getItem("smartTravelLangV6")||"de",people=[],openId=1,result=null,next=1,form={dest:"",from:"",to:""};
try{let s=JSON.parse(localStorage.getItem("smartTravelV6")||"null");if(s){lang=s.lang||lang;people=s.people||[];openId=s.openId||openId;result=s.result||null;next=s.next||1;form=s.form||form}}catch(e){}
if(!people.length)people=[{id:next++,type:"adult",name:"",age:34,gender:"na",custom:[]}];
const $=id=>document.getElementById(id),T=()=>D[lang],tr=k=>T()[k]||k;
function save(){form={dest:$("dest")?.value??form.dest,from:$("from")?.value??form.from,to:$("to")?.value??form.to};localStorage.setItem("smartTravelV6",JSON.stringify({lang,people,openId,result,next,form}))}
function setLang(l){lang=l;render();save()}
function personLabel(p){if(p.name?.trim())return p.name.trim();let n=people.filter(x=>x.type===p.type).findIndex(x=>x.id===p.id)+1;return (p.type==="adult"?tr("adult"):p.type==="child"?tr("child"):tr("baby")).replace("+ ","")+" "+n}
function addPerson(type){people.push({id:next++,type,name:"",age:type==="adult"?34:type==="child"?4:0,gender:"na",custom:[]});openId=people.at(-1).id;result=null;render();save()}
function removePerson(id){people=people.filter(p=>p.id!==id);openId=people[0]?.id;result=null;render();save()}
function updatePerson(id,k,v){let p=people.find(p=>p.id===id);if(p)p[k]=k==="age"?+v:v;save()}
function season(date,lat=35){let m=new Date(date+"T12:00:00").getMonth()+1,north=lat>=0;return (north?[12,1,2]:[6,7,8]).includes(m)?"cold":(north?[6,7,8]:[12,1,2]).includes(m)?"hot":"mild"}
function kind(dest){return /beach|strand|mallorca|malta|cyprus|antalya|alanya|rhodes|crete|sharm|hurghada|marmaris|bodrum|phuket|canc[uú]n/i.test(dest)?"beach":/alps|mountain|ski|zermatt|tirol/i.test(dest)?"mountain":"general"}
function days(){return Math.max(1,Math.min(90,Math.round((new Date($("to").value)-new Date($("from").value))/86400000)+1))}
function build(p,s,k,rain,d){let woman=p.type==="adult"&&p.gender==="female",child=p.type==="child",baby=p.type==="baby",wash=d<=7?1:d<=14?.82:d<=30?.62:.55,n=Math.max(2,Math.ceil((Math.min(d,14)*.62+2)*wash*(child?1.3:1))),a=[];
if(baby)a=[["diaper",Math.min(90,d*6+Math.ceil(d*.8)),"baby"],["wipes",Math.max(2,Math.ceil(d/3)),"baby"],["outfit",Math.ceil(d*.8)+2,"baby"],["body",Math.ceil(d*.9)+2,"baby"],["pajama",Math.ceil(d*.5)+1,"baby"],["socks",Math.ceil(d*.65)+1,"baby"],["hat",1,"baby"],["cream",1,"baby"],["bottle",3,"baby"],["milk",1,"baby"],["pacifier",2,"baby"],["blanket",1,"baby"],["stroller",1,"baby"],["bib",Math.ceil(d*.7),"baby"],["toy",1,"baby"]];
else {a=[["shirts",n,"adult"],["bottom",Math.ceil(n*.72),"adult"],["under",Math.max(4,Math.ceil((d*.75+2)*wash*(child?1.3:1))),child?"child":"adult"],["pajama",Math.max(2,Math.ceil(n*.42)),"adult"],["socks",Math.max(3,Math.ceil(n*.72)),"adult"],["shoes",1,"adult"],["charger",1,"personal"],["cable",1,"personal"],["brush",1,"personal"],["paste",1,"personal"],["deodorant",1,"personal"],["shampoo",1,"personal"],["power",1,"personal"]];
if(p.type==="adult"&&p.gender==="male")a.push(["razor",1,"personal"]);
if(s==="cold")a.push(["coat",1,"cold"],["warm",Math.max(1,Math.ceil(d/7)),"cold"],["boots",1,"cold"],["gloves",1,"cold"],["hat",1,"cold"],["rain",rain?1:0,"rain"],["umbrella",rain?1:0,"rain"]);
if(s==="mild")a.push(["light",1,"mild"],["rain",rain?1:0,"rain"],["umbrella",rain?1:0,"rain"]);
if(s==="hot"){a.push(["light",1,"hot"],["sun",1,"hot"],["spf",1,"hot"]);if(k==="beach")a.push(["swim",Math.min(4,Math.ceil(d/5)),"beach"],["sandals",1,"beach"],["towel",1,"beach"])}
if(woman)a.push(["bra",Math.max(2,Math.ceil((d*.45+2)*wash)),"woman"],["under",Math.max(4,Math.ceil((d*.78+2)*wash)),"woman"],["strings",Math.max(2,Math.ceil((d*.42+1)*wash)),"woman"],["dress",Math.max(1,Math.ceil(d/6)),"woman"]);
}
a=[...a,...(p.custom||[]).map(x=>[x.name,x.qty||1,"custom",x.id])];return a.filter(x=>x[1]>0)}
function reason(x){if(x[2]==="cold")return tr("cold");if(x[2]==="hot"||x[2]==="beach")return tr("hot");if(x[2]==="woman")return lang==="de"?"Nur für erwachsene Frauen":lang==="ar"?"للأنثى البالغة فقط":"Adult women only";return lang==="de"?"Persönlicher Bedarf":lang==="ar"?"غرض شخصي":"Personal item"}
async function makeList(){let dest=$("dest").value.trim(),from=$("from").value,to=$("to").value;if(!dest||!from||!to)return alert(tr("required"));if(to<from)return alert(tr("dateerr"));let d=days(),s=season(from),k=kind(dest),rain=s==="cold",weather=tr(s==="cold"?"cold":s==="hot"?"hot":"mild")+" "+tr("forecast");$("weatherText").textContent=tr("hint");
try{let g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(dest)+"&count=1&language=en&format=json").then(r=>r.json()),loc=g.results?.[0];if(loc){s=season(from,loc.latitude);let diff=(new Date(from+"T12:00:00")-new Date())/86400000;if(diff>=-1&&diff<=15){let u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${from}&end_date=${to}`,f=await fetch(u).then(r=>r.json());if(f.daily?.temperature_2m_max?.length){let mx=Math.max(...f.daily.temperature_2m_max),mn=Math.min(...f.daily.temperature_2m_min),pr=Math.max(...(f.daily.precipitation_probability_max||[0]));s=mx>=26?"hot":mx<12?"cold":"mild";rain=pr>=35;weather=`${loc.name} · ${Math.round(mn)}–${Math.round(mx)} °C · ${lang==="de"?"Regenrisiko":lang==="ar"?"احتمال المطر":"Rain chance"} ${pr}%`}}else weather=`${loc.name} · ${tr(s==="cold"?"cold":s==="hot"?"hot":"mild")} ${tr("forecast")}`}}catch(e){}
result={weather,items:{},checked:{}};people.forEach(p=>{result.items[p.id]=build(p,s,k,rain,d);result.checked[p.id]={}});openId=people[0]?.id;$("weatherText").textContent=weather;drawResults();save()}
function toggle(id){openId=id;drawResults();save()}
function checkItem(pid,i,v){result.checked[pid][i]=v;save();drawResults()}
function qty(pid,i,v){result.items[pid][i][1]=Math.max(0,+v||0);save();drawResults()}
function delItem(pid,i){let x=result.items[pid][i],p=people.find(p=>p.id===pid);if(x[3])p.custom=p.custom.filter(c=>c.id!==x[3]);else {p.removed=p.removed||[];p.removed.push(x[0])}result.items[pid].splice(i,1);save();drawResults()}
function addItem(pid){let inp=$("new-"+pid),name=inp.value.trim();if(!name)return;let p=people.find(p=>p.id===pid),item={id:"x"+Date.now()+Math.random().toString(16).slice(2),name,qty:1};p.custom=p.custom||[];p.custom.push(item);result.items[pid].push([name,1,"custom",item.id]);result.checked[pid][result.items[pid].length-1]=false;save();drawResults()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawResults(){if(!result){$("results").innerHTML="";return}$("results").innerHTML=`<div class="section">${tr("list")}</div><div class="muted">${tr("listHint")}</div>`+people.map(p=>{let a=result.items[p.id]||[],c=result.checked[p.id]||{},n=Object.values(c).filter(Boolean).length;return `<div class="acc ${openId===p.id?"open":""}"><button class="acchead" onclick="toggle(${p.id})">${p.type==="baby"?"👶":p.type==="child"?"🧒":p.gender==="female"?"👩":"👤"} ${esc(personLabel(p))} <span>${n}/${a.length} ${tr("done")}　⌄</span></button><div class="accbody"><div class="progress"><i style="width:${a.length?n/a.length*100:0}%"></i></div>${a.map((x,i)=>`<label class="row ${c[i]?"done":""}"><input type="checkbox" ${c[i]?"checked":""} onchange="checkItem(${p.id},${i},this.checked)"><span><b>${esc(T().items[x[0]]||x[0])}</b><small class="why">${reason(x)}</small></span><input class="qty" type="number" min="0" value="${x[1]}" onchange="qty(${p.id},${i},this.value)"><button class="x" title="${tr("remove")}" onclick="event.preventDefault();delItem(${p.id},${i})">×</button></label>`).join("")}<div class="addrow"><input id="new-${p.id}" placeholder="${tr("placeholder")}"><button class="btn primary" onclick="addItem(${p.id})">+ ${tr("add")}</button></div></div></div>`}).join("")}
function render(){document.documentElement.lang=lang;$("hero").textContent=tr("hero");$("sub").textContent=tr("sub");$("travelTab").textContent=tr("travel");$("app").innerHTML=`<h2>${tr("title")}</h2><div class="muted">${tr("hint")}</div><div class="grid"><div class="field"><label>${tr("dest")}</label><input id="dest" placeholder="z. B. Beirut, Libanon" value="${esc(form.dest)}"></div><div class="field"><label>${tr("from")}</label><input type="date" id="from" value="${form.from}"></div><div class="field"><label>${tr("to")}</label><input type="date" id="to" value="${form.to}"></div></div><div class="section">${tr("people")}</div>${people.map(p=>`<div class="person"><b>${esc(personLabel(p))}</b><div class="grid"><div class="field"><label>${tr("name")}</label><input value="${esc(p.name)}" oninput="updatePerson(${p.id},'name',this.value);this.closest('.person').querySelector('b').textContent=this.value||'${esc(personLabel(p))}'"></div><div class="field"><label>${tr("age")}</label><input type="number" min="0" value="${p.age}" oninput="updatePerson(${p.id},'age',this.value)"></div>${p.type!=="baby"?`<div class="field"><label>${tr("gender")}</label><select onchange="updatePerson(${p.id},'gender',this.value)"><option value="male" ${p.gender==="male"?"selected":""}>${tr("male")}</option><option value="female" ${p.gender==="female"?"selected":""}>${tr("female")}</option><option value="na" ${p.gender==="na"?"selected":""}>${tr("na")}</option></select></div>`:""}</div><button class="btn" onclick="removePerson(${p.id})">${tr("remove")}</button></div>`).join("")}<div class="actions"><button class="btn" onclick="addPerson('adult')">${tr("adult")}</button><button class="btn" onclick="addPerson('child')">${tr("child")}</button><button class="btn" onclick="addPerson('baby')">${tr("baby")}</button><button class="btn primary" onclick="makeList()">${tr("make")}</button></div><div class="weather"><b>${tr("climate")}</b><div id="weatherText">${result?.weather||tr("hint")}</div></div><div id="results"></div>`;["dest","from","to"].forEach(id=>$(id).addEventListener("change",()=>{form={dest:$("dest").value,from:$("from").value,to:$("to").value};save()}));drawResults()}
render();
</script></body></html>
