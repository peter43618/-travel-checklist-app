function season(date,lat=35){
  const m=new Date(date+"T12:00:00").getMonth()+1, north=lat>=0;
  if((north&&[12,1,2].includes(m))||(!north&&[6,7,8].includes(m))) return "cold";
  if((north&&[6,7,8].includes(m))||(!north&&[12,1,2].includes(m))) return "hot";
  return "mild";
}
function destinationProfile(dest){
  const x=(dest||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const beach=/beach|strand|mallorca|malta|cyprus|antalya|alanya|rhodes|crete|sharm|hurghada|marsa alam|red sea|marmaris|bodrum|phuket|cancun|tenerife|gran canaria|fuerteventura|dubai|abu dhabi|doha|resort|coast|kuste/.test(x);
  const mountain=/alps|mountain|ski|zermatt|tirol|dolomites|mount|berg|snow|schwarzwald/.test(x);
  const warmBeach=/sharm|hurghada|marsa alam|red sea|dubai|abu dhabi|doha|phuket|cancun/.test(x);
  const coldClimate=/lapland|tromso|reykjavik|iceland|finland|norway|sweden|alaska/.test(x);
  return {kind:beach?"beach":mountain?"mountain":"general",warmBeach,coldClimate};
}
function effectiveType(p){
  if(p.type==="baby") return "baby";
  const age=Number(p.age);
  if(Number.isFinite(age)&&age<2) return "baby";
  if(p.type==="child"||(Number.isFinite(age)&&age<13)) return "child";
  return "adult";
}
function tripDays(from,to){
  const a=new Date(from+"T12:00:00"),b=new Date(to+"T12:00:00");
  return Math.max(1,Math.min(90,Math.round((b-a)/86400000)+1));
}
function build(p,climate,profile,rain,d){
  const type=effectiveType(p), woman=type==="adult"&&p.gender==="female";
  const cold=climate==="cold"||(profile.kind==="mountain"&&climate!=="hot");
  const hot=climate==="hot";
  const swimSeason=profile.kind==="beach"&&(hot||profile.warmBeach);
  const days=Math.min(d,14);
  const outfits=Math.max(2,Math.min(14,Math.ceil(days*0.8+1)));
  const underwear=Math.max(2,Math.min(14,Math.ceil(days*0.85+1)));
  const a=[];
  const add=(key,qty,why="personal")=>{if(qty>0&&!a.some(x=>x[0]===key))a.push([key,qty,why]);};
  if(type==="baby"){
    add("diaper",Math.min(100,d*7+2),"baby");
    add("wipes",Math.max(2,Math.ceil(d/3)),"baby");
    add("outfit",Math.max(3,Math.ceil(days*1.2)),"baby");
    add("body",Math.max(3,Math.ceil(days*1.2)),"baby");
    add("pajama",Math.max(2,Math.ceil(days*.7)),"baby");
    add("socks",Math.max(3,Math.ceil(days*.8)),"baby");
    add("hat",cold?1:0,"cold");
    add("cream",1,"baby"); add("bottle",3,"baby"); add("milk",1,"baby");
    add("pacifier",2,"baby"); add("blanket",1,"baby"); add("stroller",1,"baby");
    add("bib",Math.max(2,Math.ceil(days*.8)),"baby"); add("toy",1,"baby");
    if(swimSeason){add("swim",1,"beach");add("swimdiaper",Math.max(1,Math.ceil(d/2)),"beach");add("towel",1,"beach");add("sunhat",1,"beach");}
    if(hot){add("sunhat",1,"hot");add("spf",1,"hot");add("light",1,"hot");}
    if(cold){add("coat",1,"cold");add("warm",2,"cold");add("hat",1,"cold");}
  } else if(type==="child"){
    add("shirts",outfits,"child"); add("bottom",Math.max(2,Math.ceil(outfits*.8)),"child");
    add("under",underwear+1,"child"); add("pajama",Math.max(2,Math.ceil(days*.5)),"child");
    add("socks",Math.max(3,Math.ceil(days*.8)),"child"); add("shoes",1,"child");
    add("outfit",Math.max(2,Math.ceil(days/3)),"child"); add("toy",1,"child");
    add("brush",1,"hygiene");add("paste",1,"hygiene");
    if(cold){add("coat",1,"cold");add("warm",Math.max(1,Math.ceil(days/5)),"cold");add("boots",1,"cold");add("gloves",1,"cold");add("hat",1,"cold");}
    else if(hot){add("light",1,"hot");add("sunhat",1,"hot");add("spf",1,"hot");}
    else add("light",1,"mild");
    if(swimSeason){add("swim",Math.min(3,Math.max(1,Math.ceil(d/4))),"beach");add("sandals",1,"beach");add("towel",1,"beach");}
    if(rain)add("rain",1,"rain");
  } else {
    add("shirts",outfits,"adult");add("bottom",Math.max(2,Math.ceil(outfits*.72)),"adult");
    add("under",underwear,"adult");add("pajama",Math.max(1,Math.ceil(days*.42)),"adult");
    add("socks",Math.max(3,Math.ceil(days*.72)),"adult");add("shoes",1,"adult");
    add("brush",1,"hygiene");add("paste",1,"hygiene");add("deodorant",1,"hygiene");
    add("shampoo",1,"hygiene");add("comb",1,"hygiene");
    add("charger",1,"electronics");add("cable",1,"electronics");add("power",1,"electronics");
    if(p.gender==="male")add("razor",1,"hygiene");
    if(cold){add("coat",1,"cold");add("warm",Math.max(1,Math.ceil(days/7)),"cold");add("boots",1,"cold");add("gloves",1,"cold");add("hat",1,"cold");}
    else if(hot){add("light",1,"hot");add("sun",1,"hot");add("spf",1,"hot");}
    else add("light",1,"mild");
    if(swimSeason){add("swim",Math.min(4,Math.max(1,Math.ceil(d/4))),"beach");add("sandals",1,"beach");add("towel",1,"beach");}
    if(profile.kind==="mountain"){add("boots",1,"cold");add("warm",1,"cold");}
    if(woman){add("bra",Math.max(2,Math.ceil(days*.5)),"woman");add("strings",Math.max(2,Math.ceil(days*.5)),"woman");add("dress",Math.max(1,Math.ceil(days/6)),"woman");}
    if(rain){add("rain",1,"rain");add("umbrella",1,"rain");}
  }
  // Sun protection glasses are intentionally not a default baby item; clothing/shade are prioritized.
  a.push(...(p.custom||[]).map(x=>[x.name,x.qty||1,"custom",x.id]));
  const seen=new Set();
  return a.filter(x=>x[1]>0&&!((p.removed||[]).includes(x[0]))&&!seen.has(x[0])&&seen.add(x[0]));
}
function reason(x){
 if(x[2]==="cold")return tr("cold");
 if(x[2]==="hot"||x[2]==="beach")return tr("hot");
 if(x[2]==="woman")return lang==="de"?"Nur für erwachsene Frauen":lang==="ar"?"للأنثى البالغة فقط":"Adult women only";
 if(x[2]==="baby")return lang==="de"?"Für Babys":lang==="ar"?"مناسب للرضّع":"Baby-specific";
 if(x[2]==="child")return lang==="de"?"Für Kinder":lang==="ar"?"مناسب للأطفال":"Child-specific";
 if(x[2]==="hygiene")return lang==="de"?"Hygiene":lang==="ar"?"نظافة شخصية":"Personal hygiene";
 if(x[2]==="electronics")return lang==="de"?"Elektronik für Erwachsene":lang==="ar"?"إلكترونيات للبالغين":"Adult electronics";
 if(x[2]==="rain")return lang==="de"?"Bei Regenrisiko":lang==="ar"?"عند احتمال المطر":"If rain is likely";
 return lang==="de"?"Persönlicher Bedarf":lang==="ar"?"غرض شخصي":"Personal item";
}
async function makeList(){
 let dest=$("dest").value.trim(),from=$("from").value,to=$("to").value;
 if(!dest||!from||!to)return alert(tr("required"));
 if(to<from)return alert(tr("dateerr"));
 const d=tripDays(from,to), profile=destinationProfile(dest), month=+(from.split("-")[1]||"0");
 let climate=season(from), rain=false;
 if(profile.coldClimate)climate="cold";
 if(profile.warmBeach&&[3,4,5,6,7,8,9,10,11].includes(month))climate="hot";
 let weather=`${tr(climate==="cold"?"cold":climate==="hot"?"hot":"mild")} ${tr("forecast")}`;
 $("weatherText").textContent=tr("hint");
 try{
  const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(dest)+"&count=1&language=en&format=json").then(r=>r.json());
  const loc=g.results?.[0];
  if(loc){
   climate=season(from,loc.latitude);
   if(profile.coldClimate)climate="cold";
   if(profile.warmBeach&&[3,4,5,6,7,8,9,10,11].includes(month))climate="hot";
   const diff=(new Date(from+"T12:00:00")-new Date())/86400000;
   if(diff>=-1&&diff<=15){
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${from}&end_date=${to}`;
    const f=await fetch(u).then(r=>r.json());
    if(f.daily?.temperature_2m_max?.length){
     const mx=Math.max(...f.daily.temperature_2m_max),mn=Math.min(...f.daily.temperature_2m_min),pr=Math.max(...(f.daily.precipitation_probability_max||[0]));
     if(profile.warmBeach&&mx>=22)climate="hot";
     else climate=mx>=26?"hot":mx<12?"cold":"mild";
     rain=pr>=35;
     weather=`${loc.name} · ${Math.round(mn)}–${Math.round(mx)} °C · ${lang==="de"?"Regenrisiko":lang==="ar"?"احتمال المطر":"Rain chance"} ${pr}%`;
    }
   } else weather=`${loc.name} · ${tr(climate==="cold"?"cold":climate==="hot"?"hot":"mild")} ${tr("forecast")}`;
  }
 }catch(e){}
 result={weather,items:{},checked:{}};
 people.forEach(p=>{result.items[p.id]=build(p,climate,profile,rain,d);result.checked[p.id]={}});
 openId=people[0]?.id;openIds=openId?[openId]:[];
 $("weatherText").textContent=weather;
 drawResults();initScan();save();
}
function toggle(id){if(openIds.includes(id))openIds=openIds.filter(x=>x!==id);else openIds.push(id);openId=openIds.at(-1)||null;drawResults();save()}
function checkItem(pid,i,v){result.checked[pid][i]=v;save();drawResults()}
function qty(pid,i,v){result.items[pid][i][1]=Math.max(0,+v||0);save();drawResults()}
function delItem(pid,i){let x=result.items[pid][i],p=people.find(p=>p.id===pid);if(x[3])p.custom=p.custom.filter(c=>c.id!==x[3]);else {p.removed=p.removed||[];p.removed.push(x[0])}result.items[pid].splice(i,1);save();drawResults()}
function addItem(pid){let inp=$("new-"+pid),name=inp.value.trim();if(!name)return;let p=people.find(p=>p.id===pid),item={id:"x"+Date.now()+Math.random().toString(16).slice(2),name,qty:1};p.custom=p.custom||[];p.custom.push(item);result.items[pid].push([name,1,"custom",item.id]);result.checked[pid][result.items[pid].length-1]=false;save();drawResults()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawResults(){if(!result){$("results").innerHTML="";return}$("results").innerHTML=`<div class="section">${tr("list")}</div><div class="muted">${tr("listHint")}</div>`+people.map(p=>{let a=result.items[p.id]||[],c=result.checked[p.id]||{},n=Object.values(c).filter(Boolean).length;return `<div class="acc ${openIds.includes(p.id)?"open":""}"><button class="acchead" onclick="toggle(${p.id})">${p.type==="baby"?"👶":p.type==="child"?"🧒":p.gender==="female"?"👩":"👤"} ${esc(personLabel(p))} <span>${n}/${a.length} ${tr("done")}　⌄</span></button><div class="accbody"><div class="progress"><i style="width:${a.length?n/a.length*100:0}%"></i></div><div class="addrow"><input id="new-${p.id}" placeholder="${tr("placeholder")}"><button class="btn primary" onclick="addItem(${p.id})">+ ${tr("add")}</button></div>${a.map((x,i)=>`<label class="row ${c[i]?"done":""}"><input type="checkbox" ${c[i]?"checked":""} onchange="checkItem(${p.id},${i},this.checked)"><span><b>${esc(T().items[x[0]]||x[0])}</b><small class="why">${reason(x)}</small></span><input class="qty" type="number" min="0" value="${x[1]}" onchange="qty(${p.id},${i},this.value)"><button class="x" title="${tr("remove")}" onclick="event.preventDefault();delItem(${p.id},${i})">×</button></label>`).join("")}</div></div>`}).join("")}

function suggestWardrobeOutfits(){const owner=$("outfitOwner").value,temp=$("outfitTemp").value,occasion=$("outfitOccasion").value;const items=wardrobeData.items.filter(i=>i.owner===owner&&(i.status||"available")==="available");if(!items.length){$("wardOutfits").innerHTML=`<p class="muted">${wt("needItems")}</p>`;return;}const by=t=>items.filter(i=>i.type===t);let tops=[...by("shirt"),...by("top"),...by("sweater")],bottoms=[...by("pants"),...by("shorts")],outer=by(temp==="cold"?"coat":"jacket");if(temp==="hot")tops=[...by("shirt"),...by("top")];if(occasion==="formal")tops=[...by("top"),...by("shirt"),...by("sweater")];if(occasion==="work")tops=[...by("top"),...by("shirt"),...by("sweater")];const dresses=by("dress"),shoes=by("shoes");let outfits=[];for(let n=0;n<3;n++){let parts=[];const top=tops[n%Math.max(1,tops.length)],bottom=bottoms[(n+1)%Math.max(1,bottoms.length)],dress=dresses[n%dresses.length],jacket=outer[n%Math.max(1,outer.length)],shoe=shoes[n%Math.max(1,shoes.length)];if(dress)parts.push(dress);else{if(top)parts.push(top);if(bottom)parts.push(bottom);}if(jacket&&temp!=="hot")parts.push(jacket);if(shoe)parts.push(shoe);if(parts.length)outfits.push(parts);}if(!outfits.length){$("wardOutfits").innerHTML=`<p class="muted">${wt("needItems")}</p>`;return;}lastSuggestedOutfits=outfits.map((items,index)=>({owner,occasion,temp,title:`${wt("look")} ${index+1}`,items:items.map(i=>i.id)}));$("wardOutfits").innerHTML=`<div class="ward-grid">${outfits.map((o,n)=>`<div class="ward-card"><h4>${wt("look")} ${n+1}</h4>${o.map(i=>{const b=wardrobeImageBatch(i.batch);return `<div style="display:flex;gap:8px;align-items:center;margin:8px 0">${b?`<img src="${b.data}" style="width:58px;height:58px;object-fit:cover">`:""}<span>${wt(i.type)} ${i.color?"· "+esc(i.color):""}</span></div>`}).join("")}<button class="btn" onclick="saveSuggestedOutfit(${n})">⭐ ${lang==="ar"?"احفظ الإطلالة":"Save look"}</button></div>`).join("")}</div>`;}

function saveWeeklyPlan(){if(!lastSuggestedOutfits.length){alert(lang==="ar"?"ولّد إطلالة أولاً من قسم الاقتراحات.":"Generate outfits first, then save one to the weekly plan.");return;}const idx=Number(prompt(lang==="ar"?"أي إطلالة تحفظ؟ اكتب 1 أو 2 أو 3":"Which look? Enter 1, 2 or 3","1"))-1;const o=lastSuggestedOutfits[idx];if(!o)return;let plan=[];try{plan=JSON.parse(localStorage.getItem("smartFamilyWeeklyPlanV1")||"[]")}catch(e){}const day=Number($("weekDay")?.value||0);plan=plan.filter(x=>!(x.day===day&&x.owner===o.owner));plan.push({...o,day,id:"plan"+Date.now()});localStorage.setItem("smartFamilyWeeklyPlanV1",JSON.stringify(plan));drawWeeklyPlan();alert(lang==="ar"?"انحفظت الإطلالة للأسبوع":"Added to weekly plan");}

function buildWardrobePacking(){const owner=$("packOwner")?.value,days=Math.max(1,Math.min(30,Number($("packDays")?.value)||7));const items=wardrobeData.items.filter(i=>i.owner===owner&&(i.status||"available")==="available");const types=new Set(items.map(i=>i.type));const suggested=[];const add=(type,qty)=>{const matches=items.filter(i=>i.type===type);matches.slice(0,qty).forEach(i=>suggested.push(i));};if(types.has("shirt")||types.has("top")){add("shirt",Math.min(days,5));add("top",Math.max(0,Math.min(days,5)-suggested.length));}add("pants",Math.min(3,Math.ceil(days/3)));add("shorts",Math.min(2,Math.ceil(days/4)));add("sweater",1);add("jacket",1);add("coat",1);add("shoes",1);add("swim",1);const uniq=[...new Map(suggested.map(i=>[i.id,i])).values()];const el=$("wardPackResult");if(!el)return;if(!uniq.length){el.innerHTML=`<p class="muted">${lang==="ar"?"ما في ملابس متاحة لهالشخص بعد. أضف قطعاً للخزانة أولاً.":"No available clothes for this person yet. Add items to the wardrobe first."}</p>`;return;}el.innerHTML=`<p class="muted">${lang==="ar"?`اقتراح مبدئي لـ ${days} أيام. راجع القائمة وعدّلها حسب الطقس والأنشطة.`:`Starter list for ${days} days. Review it and adjust for weather and activities.`}</p>${uniq.map(i=>`<div class="scanitem"><label><input type="checkbox"> ${wt(i.type)} ${i.color?"· "+esc(i.color):""} <small>(${esc(i.size||"—")})</small></label><span>${esc(wardrobePerson(i.owner)?.name||"")}</span></div>`).join("")}`;}
function exportWardrobeData(){const data={people:wardrobeData.people,items:wardrobeData.items.map(i=>({...i,batch:i.batch})),batches:wardrobeData.batches.map(b=>({...b,data:"[image stored locally; included in local export only if browser permits]"})),savedOutfits};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="smart-family-wardrobe-export.json";a.click();URL.revokeObjectURL(a.href);}

function refreshScanItems(){const personId=+$("scanPerson").value;const p=people.find(x=>x.id===personId);const items=result?.items?.[personId]||[];$("scanItem").innerHTML=items.map((x,i)=>`<option value="${i}">${esc(T().items[x[0]]||x[0])} (${tr("scanNeed")}: ${x[1]})</option>`).join("");}
function initScan(){const sel=$("scanPerson");if(!sel)return;sel.innerHTML=people.map(p=>`<option value="${p.id}">${esc(personLabel(p))}</option>`).join("");if(!result){$("scanItem").innerHTML="<option>—</option>";return}refreshScanItems();}
function compareScan(){if(!result){alert(tr("scanChoose"));return}const pid=+$("scanPerson").value,idx=+$("scanItem").value,available=Math.max(0,Number($("scanQty").value)||0),x=(result.items[pid]||[])[idx];if(!x)return;const need=Number(x[1])||0,missing=Math.max(0,need-available),name=T().items[x[0]]||x[0],out=$("scanResult");out.style.display="block";out.innerHTML=`<b>${esc(name)}</b><div class="scanitem"><span>${tr("scanNeed")}</span><b>${need}</b></div><div class="scanitem"><span>${tr("scanHave")}</span><b>${available}</b></div><div class="scanitem"><span>${tr("scanMissing")}</span><b style="color:${missing?"#b42318":"#16803d"}">${missing}</b></div><p class="muted" style="margin-bottom:0">${missing?`${tr("scanMissing")}: ${missing} ${esc(name)}`:tr("scanEnough")}</p>`;}
render();
</script></body></html>
