<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10263f">
<title>LifeFolder AI — Family Document Hub</title>
<style>
:root{--navy:#10263f;--blue:#315f8c;--ink:#172638;--muted:#718096;--line:#e5eaf0;--bg:#f5f7fa;--white:#fff;--soft:#edf2f7;--green:#18794e;--shadow:0 12px 34px rgba(16,38,63,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:258px 1fr}
.sidebar{background:var(--navy);color:#fff;padding:25px 17px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:39px;height:39px;border-radius:12px;background:#e8f0f8;color:var(--navy);display:grid;place-items:center;font-size:20px;font-weight:800}.brand strong{font-size:17px;letter-spacing:-.3px}.brand small{display:block;color:#aebed0;font-size:10px;letter-spacing:1.5px;margin-top:1px}
.nav-label{font-size:10px;letter-spacing:1.6px;color:#8fa5bc;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c9d4e0;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#213b57;color:#fff}.nav .ico{width:19px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid #29415a;padding:17px 8px 0;color:#aebed0;font-size:12px}
.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:10px}.lang{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}.avatar{width:35px;height:35px;border-radius:50%;background:#e8eef5;color:#24496e;display:grid;place-items:center;font-weight:700}
.content{max-width:1200px;margin:0 auto;padding:34px 36px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:26px}.eyebrow{font-size:11px;color:var(--blue);font-weight:750;letter-spacing:1.4px;text-transform:uppercase}.page-head h1{margin:5px 0 5px;font-size:29px;letter-spacing:-1px}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 15px;font-weight:650;display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:#9eb2c7;background:#f9fbfd}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:#1d3d5e}.btn.small{padding:7px 10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}.stat,.panel,.folder-card,.empty,.doc-row{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 2px 8px rgba(16,38,63,.025)}.stat{padding:19px 20px;display:flex;align-items:center;gap:14px}.stat-icon{width:42px;height:42px;border-radius:12px;background:#eef3f8;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:23px;line-height:1.1}.stat span{color:var(--muted);font-size:12px}.section-row{display:flex;align-items:center;justify-content:space-between;margin:27px 0 13px}.section-row h2{font-size:16px;margin:0}.folder-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.folder-card{padding:17px;text-align:left;transition:.15s;cursor:pointer;min-height:130px}.folder-card:hover{transform:translateY(-2px);border-color:#a9bbce;box-shadow:var(--shadow)}.folder-symbol{width:39px;height:39px;border-radius:11px;background:#edf3f8;display:grid;place-items:center;font-size:19px;margin-bottom:14px}.folder-card strong{display:block;font-size:14px}.folder-card small{color:var(--muted)}.panel{padding:20px}.panel h2{font-size:16px;margin:0 0 14px}.quick-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.searchbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}.searchbox input{border:0;outline:0;flex:1;min-width:0}.muted{color:var(--muted)}.empty{padding:45px 20px;text-align:center;border-style:dashed;box-shadow:none}.empty .big{font-size:31px;margin-bottom:10px}.empty h3{margin:0 0 6px}.empty p{margin:0 auto 16px;color:var(--muted);max-width:430px}.list{display:grid;gap:9px}.doc-row{padding:13px 15px;display:flex;align-items:center;gap:12px}.file-icon{width:38px;height:42px;border-radius:9px;background:#f0f3f7;display:grid;place-items:center}.doc-meta{flex:1;min-width:0}.doc-meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-meta small{color:var(--muted)}.tag{font-size:11px;color:#526b83;background:#edf3f8;padding:4px 8px;border-radius:20px}.form{display:grid;gap:14px;max-width:560px}.field label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline-color:#7e9dbd}.drop{border:1.5px dashed #b9c8d7;border-radius:14px;padding:35px;text-align:center;background:#fafcfe}.drop input{max-width:100%;margin-top:12px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:22px;background:#142c45;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:20}
.mobile-head{display:none}
@media(max-width:900px){.shell{grid-template-columns:78px 1fr}.sidebar{padding:22px 10px}.brand{justify-content:center;padding:0}.brand-text,.nav-label,.nav-text,.side-bottom{display:none}.nav button{justify-content:center;padding:12px}.nav .ico{font-size:19px}.content{padding:27px 22px}.topbar{padding:0 22px}.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.shell{display:block;padding-bottom:68px}.sidebar{display:none}.topbar{height:62px;padding:0 16px}.content{padding:23px 15px 35px}.page-head{align-items:flex-start}.page-head h1{font-size:24px}.stats{gap:8px}.stat{padding:12px 10px;gap:8px}.stat-icon{width:33px;height:33px;font-size:15px}.stat strong{font-size:19px}.stat span{font-size:10px}.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.folder-card{padding:13px;min-height:120px}.quick-grid{grid-template-columns:1fr}.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.mobile-nav button{border:0;background:none;color:#66788a;font-size:10px;display:grid;justify-items:center;gap:2px}.mobile-nav button b{font-size:18px;font-weight:400}.mobile-nav button.active{color:#173c60}.lang{padding:7px 6px;font-size:12px}.crumb{font-size:12px}.avatar{width:31px;height:31px}}
[dir=rtl] body{text-align:right}[dir=rtl] .nav button{text-align:right}[dir=rtl] .page-head,[dir=rtl] .section-row{flex-direction:row-reverse}[dir=rtl] .topbar{direction:rtl}[dir=rtl] .doc-row{direction:rtl}
</style></head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="logo">L</div><div class="brand-text"><strong>LifeFolder AI</strong><small>FAMILY DOCUMENT HUB</small></div></div>
  <div><div class="nav-label" data-i="workspace">WORKSPACE</div><nav class="nav">
    <button class="active" data-page="home"><span class="ico">⌂</span><span class="nav-text" data-i="overview">Overview</span></button>
    <button data-page="documents"><span class="ico">▤</span><span class="nav-text" data-i="documents">Documents</span></button>
    <button data-page="search"><span class="ico">⌕</span><span class="nav-text" data-i="smartSearch">Smart search</span></button>
    <button data-page="reminders"><span class="ico">◷</span><span class="nav-text" data-i="reminders">Reminders</span></button>
  </nav></div>
  <div><div class="nav-label" data-i="manage">MANAGE</div><nav class="nav">
    <button data-page="profiles"><span class="ico">♙</span><span class="nav-text" data-i="profiles">Family profiles</span></button>
    <button data-page="settings"><span class="ico">⚙</span><span class="nav-text" data-i="settings">Settings</span></button>
  </nav></div>
  <div class="side-bottom">Private family space<br>Secure by design</div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb" id="crumb">Workspace / Overview</div><div class="top-actions">
<select class="lang" id="language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="ar">العربية</option></select><div class="avatar">LF</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<nav class="mobile-nav">
<button class="active" data-page="home"><b>⌂</b><span data-i="overview">Overview</span></button>
<button data-page="documents"><b>▤</b><span data-i="documents">Documents</span></button>
<button data-page="search"><b>⌕</b><span data-i="smartSearch">Search</span></button>
<button data-page="reminders"><b>◷</b><span data-i="reminders">Reminders</span></button>
<button data-page="profiles"><b>♙</b><span data-i="profiles">Profiles</span></button>
</nav>
<div id="toast" class="toast hidden"></div>
<script>
const translations={
de:{workspace:"ARBEITSBEREICH",manage:"VERWALTUNG",overview:"Übersicht",documents:"Dokumente",smartSearch:"Intelligente Suche",reminders:"Erinnerungen",profiles:"Personenprofile",settings:"Einstellungen",title:"Dein digitaler Familienordner",subtitle:"Alle wichtigen Unterlagen sicher und übersichtlich an einem Ort.",newFile:"Neue Datei",newFolder:"Neuer Ordner",shared:"Gemeinsamer Haushalt",personal:"Persönliche Profile",recent:"Zuletzt hinzugefügt",emptyTitle:"Noch keine Dokumente",emptyText:"Lade deine erste PDF-Datei oder ein Foto hoch. Deine Ablage beginnt hier.",addFirst:"Dokument hinzufügen",folders:"Ordner",files:"Dokumente",events:"Erinnerungen",searchTitle:"Finde jedes Dokument",searchText:"Suche nach Dateiname, Person, Stichwort oder Dokumenttyp.",searchPlaceholder:"Zum Beispiel: Aufenthaltstitel, Stromvertrag …",noResults:"Keine passenden Dokumente gefunden.",profileTitle:"Personenprofile",profileText:"Lege für jedes Familienmitglied einen eigenen privaten Bereich an.",createProfile:"Profil erstellen",name:"Name",folderName:"Ordnername",create:"Erstellen",cancel:"Abbrechen",uploadTitle:"Dokument hinzufügen",chooseFile:"Datei auswählen",assign:"Speichern in",selectFolder:"Ordner auswählen",uploadHint:"PDF, JPG oder PNG. Dateien bleiben in dieser lokalen Demo nur in deinem Browser.",save:"Hinzufügen",reminderTitle:"Erinnerungen",reminderText:"Erkannte Fristen und Termine werden hier angezeigt, sobald Dokumente analysiert wurden.",settingsTitle:"Einstellungen",language:"Sprache",privacy:"Datenschutz",privacyText:"Echte Dokumente sollten erst nach Einrichtung von Anmeldung, Verschlüsselung, EU-Hosting und Backups gespeichert werden.",folderEmpty:"Dieser Ordner ist noch leer.",rename:"Umbenennen",delete:"Löschen",back:"Zurück",type:"Typ",all:"Alle",house:"Haushalt",profile:"Profil",newProfile:"Neues Profil",addFolder:"Ordner erstellen",open:"Öffnen",unknown:"Nicht zugeordnet"},
en:{workspace:"WORKSPACE",manage:"MANAGE",overview:"Overview",documents:"Documents",smartSearch:"Smart search",reminders:"Reminders",profiles:"Family profiles",settings:"Settings",title:"Your family document hub",subtitle:"All important documents, securely organized in one place.",newFile:"New file",newFolder:"New folder",shared:"Shared household",personal:"Personal profiles",recent:"Recently added",emptyTitle:"No documents yet",emptyText:"Upload your first PDF or photo. Your organized archive starts here.",addFirst:"Add a document",folders:"Folders",files:"Documents",events:"Reminders",searchTitle:"Find any document",searchText:"Search by filename, person, keyword or document type.",searchPlaceholder:"For example: residence permit, electricity contract …",noResults:"No matching documents found.",profileTitle:"Family profiles",profileText:"Create a separate personal space for each family member.",createProfile:"Create profile",name:"Name",folderName:"Folder name",create:"Create",cancel:"Cancel",uploadTitle:"Add a document",chooseFile:"Choose file",assign:"Save to",selectFolder:"Select a folder",uploadHint:"PDF, JPG or PNG. In this local demo, files stay in your browser only.",save:"Add document",reminderTitle:"Reminders",reminderText:"Detected deadlines and appointments will appear here after document analysis is connected.",settingsTitle:"Settings",language:"Language",privacy:"Privacy",privacyText:"Real documents should only be stored after authentication, encryption, EU hosting and backups are configured.",folderEmpty:"This folder is empty.",rename:"Rename",delete:"Delete",back:"Back",type:"Type",all:"All",house:"Household",profile:"Profile",newProfile:"New profile",addFolder:"Create folder",open:"Open",unknown:"Unassigned"},
ar:{workspace:"مساحة العمل",manage:"الإدارة",overview:"الرئيسية",documents:"المستندات",smartSearch:"البحث الذكي",reminders:"التذكيرات",profiles:"ملفات العائلة",settings:"الإعدادات",title:"ملفات العائلة الرقمية",subtitle:"كل أوراقكم المهمة محفوظة ومنظمة بمكان واحد.",newFile:"ملف جديد",newFolder:"مجلد جديد",shared:"ملف البيت المشترك",personal:"الملفات الشخصية",recent:"المضاف حديثاً",emptyTitle:"لا توجد مستندات بعد",emptyText:"ارفع أول ملف PDF أو صورة. من هنا يبدأ أرشيفك المنظم.",addFirst:"إضافة مستند",folders:"المجلدات",files:"المستندات",events:"التذكيرات",searchTitle:"اعثر على أي مستند",searchText:"ابحث باسم الملف أو الشخص أو كلمة أو نوع المستند.",searchPlaceholder:"مثلاً: الإقامة، عقد الكهرباء…",noResults:"لم يتم العثور على مستند مطابق.",profileTitle:"ملفات أفراد العائلة",profileText:"أنشئ مساحة شخصية مستقلة لكل فرد من العائلة.",createProfile:"إنشاء ملف شخصي",name:"الاسم",folderName:"اسم المجلد",create:"إنشاء",cancel:"إلغاء",uploadTitle:"إضافة مستند",chooseFile:"اختر ملفاً",assign:"الحفظ في",selectFolder:"اختر مجلداً",uploadHint:"PDF أو JPG أو PNG. في هذه النسخة المحلية تبقى الملفات داخل متصفحك فقط.",save:"إضافة المستند",reminderTitle:"التذكيرات",reminderText:"ستظهر المواعيد والمهل المستخرجة هنا بعد ربط تحليل المستندات.",settingsTitle:"الإعدادات",language:"اللغة",privacy:"الخصوصية",privacyText:"يجب عدم حفظ مستندات حقيقية قبل تجهيز تسجيل الدخول والتشفير والاستضافة الأوروبية والنسخ الاحتياطية.",folderEmpty:"هذا المجلد فارغ حالياً.",rename:"إعادة تسمية",delete:"حذف",back:"رجوع",type:"النوع",all:"الكل",house:"البيت",profile:"ملف شخصي",newProfile:"ملف شخصي جديد",addFolder:"إنشاء مجلد",open:"فتح",unknown:"غير مصنف"}
};
let lang="de",page="home",folders=[{id:"household",name:"Shared household",kind:"house" }],docs=[],activeFolder=null;
const t=k=>translations[lang][k]||k, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let el=document.getElementById("toast");el.textContent=s;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2600)}
function setLang(v){lang=v;document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr";document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));render()}
function go(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
document.getElementById("language").addEventListener("change",e=>setLang(e.target.value));
function head(k,desc,action=""){return `<div class="page-head"><div><div class="eyebrow">LIFEFOLDER AI</div><h1>${t(k)}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function folderCard(f){return `<div class="folder-card" onclick="openFolder('${f.id}')"><div class="folder-symbol">${f.kind==="house"?"⌂":"♙"}</div><strong>${esc(f.name)}</strong><small>${f.kind==="house"?t("shared"):t("profile")}</small></div>`}
function docRows(items){if(!items.length)return `<div class="empty"><div class="big">▤</div><h3>${t("emptyTitle")}</h3><p>${t("emptyText")}</p><button class="btn primary" onclick="go('upload')">＋ ${t("addFirst")}</button></div>`;return `<div class="list">${items.map(d=>`<div class="doc-row"><div class="file-icon">▤</div><div class="doc-meta"><strong>${esc(d.name)}</strong><small>${esc(d.folderName)} · ${esc(d.size)}</small></div><span class="tag">${esc(d.type)}</span></div>`).join("")}</div>`}
function render(){
let c=document.getElementById("content"),crumb={home:t("overview"),documents:t("documents"),search:t("smartSearch"),reminders:t("reminders"),profiles:t("profiles"),settings:t("settings"),upload:t("uploadTitle"),folder:activeFolder?.name||t("documents")};document.getElementById("crumb").textContent="LifeFolder / "+(crumb[page]||"");
if(page==="home"){
c.innerHTML=head("title",t("subtitle"),`<button class="btn primary" onclick="go('upload')">＋ ${t("newFile")}</button>`)+
`<div class="stats"><div class="stat"><div class="stat-icon">▤</div><div><strong>${docs.length}</strong><span>${t("files")}</span></div></div><div class="stat"><div class="stat-icon">▣</div><div><strong>${folders.length}</strong><span>${t("folders")}</span></div></div><div class="stat"><div class="stat-icon">◷</div><div><strong>0</strong><span>${t("events")}</span></div></div></div>
<div class="section-row"><h2>${t("folders")}</h2><button class="btn small" onclick="newFolder()">＋ ${t("newFolder")}</button></div><div class="folder-grid">${folders.map(folderCard).join("")}<div class="folder-card" onclick="newProfile()"><div class="folder-symbol">＋</div><strong>${t("newProfile")}</strong><small>${t("createProfile")}</small></div></div>
<div class="section-row"><h2>${t("recent")}</h2><button class="btn small" onclick="go('documents')">${t("documents")} →</button></div>${docRows(docs.slice(-4).reverse())}`;
}else if(page==="documents"){
c.innerHTML=head("documents",t("subtitle"),`<button class="btn primary" onclick="go('upload')">＋ ${t("newFile")}</button>`)+`<div class="section-row"><h2>${t("folders")}</h2><button class="btn small" onclick="newFolder()">＋ ${t("newFolder")}</button></div><div class="folder-grid">${folders.map(folderCard).join("")}</div><div class="section-row"><h2>${t("recent")}</h2></div>${docRows([...docs].reverse())}`;
}else if(page==="folder"){
let items=docs.filter(d=>d.folderId===activeFolder.id);c.innerHTML=head("documents",esc(activeFolder.name),`<button class="btn" onclick="go('documents')">← ${t("back")}</button><button class="btn primary" onclick="go('upload')">＋ ${t("newFile")}</button>`)+docRows(items);
}else if(page==="search"){
c.innerHTML=head("searchTitle",t("searchText"))+`<div class="panel"><div class="searchbox">⌕ <input id="q" placeholder="${t("searchPlaceholder")}" oninput="searchDocs(this.value)"></div><div id="search-results" style="margin-top:18px">${docRows(docs)}</div></div>`;
}else if(page==="profiles"){
let personal=folders.filter(f=>f.kind==="profile");c.innerHTML=head("profileTitle",t("profileText"),`<button class="btn primary" onclick="newProfile()">＋ ${t("createProfile")}</button>`)+`<div class="folder-grid">${personal.map(folderCard).join("")}<div class="folder-card" onclick="newProfile()"><div class="folder-symbol">＋</div><strong>${t("newProfile")}</strong></div></div>`;
}else if(page==="reminders"){
c.innerHTML=head("reminderTitle",t("reminderText"))+`<div class="empty"><div class="big">◷</div><h3>${t("reminderTitle")}</h3><p>${t("reminderText")}</p></div>`;
}else if(page==="settings"){
c.innerHTML=head("settingsTitle",t("privacyText"))+`<div class="panel"><h2>${t("language")}</h2><select class="lang" onchange="document.getElementById('language').value=this.value;setLang(this.value)"><option value="de" ${lang==="de"?"selected":""}>Deutsch</option><option value="en" ${lang==="en"?"selected":""}>English</option><option value="ar" ${lang==="ar"?"selected":""}>العربية</option></select><div class="section-row"><h2>${t("privacy")}</h2></div><p class="muted">${t("privacyText")}</p></div>`;
}else if(page==="upload"){
c.innerHTML=head("uploadTitle",t("uploadHint"))+`<div class="panel"><form class="form" id="upload-form"><div class="field"><label>${t("chooseFile")}</label><div class="drop">⇧<br><input type="file" id="file" accept=".pdf,image/png,image/jpeg" required><p class="muted">${t("uploadHint")}</p></div></div><div class="field"><label>${t("assign")}</label><select id="target">${folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select></div><button class="btn primary" type="submit">${t("save")}</button></form></div>`;
document.getElementById("upload-form").addEventListener("submit",e=>{e.preventDefault();let f=document.getElementById("file").files[0],folder=folders.find(x=>x.id===document.getElementById("target").value);if(!f)return;docs.push({name:f.name,folderId:folder.id,folderName:folder.name,size:(f.size/1024).toFixed(0)+" KB",type:f.type.includes("pdf")?"PDF":"Image"});toast(t("save"));go("documents")});
}
}
function openFolder(id){activeFolder=folders.find(f=>f.id===id);go("folder")}
function newFolder(){let n=prompt(t("folderName"));if(n&&n.trim()){folders.push({id:"f"+Date.now(),name:n.trim(),kind:"custom"});render()}}
function newProfile(){let n=prompt(t("name"));if(n&&n.trim()){folders.push({id:"p"+Date.now(),name:n.trim(),kind:"profile"});render()}}
function searchDocs(q){let el=document.getElementById("search-results"),items=docs.filter(d=>(d.name+" "+d.folderName).toLowerCase().includes(q.toLowerCase()));el.innerHTML=q?docRows(items):docRows(docs)}
render();
</script>
</body></html>
